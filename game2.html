<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #0000ff;
            background-color: black;
        }
    </style>
</head>
<body>

    <div id="score-board">2 Ghosts | Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="380" height="400"></canvas>

    <script>
        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");
        var scoreElement = document.getElementById("score");

        var tileSize = 20;
        var score = 0;
        var gameOver = false;
        var gameWon = false;

        var mapLayout = [
            "1111111111111111111",
            "1000000001000000001",
            "1011011101011101101",
            "1000000000000000001",
            "1011010111110101101",
            "1000010001000100001",
            "1111011121211101111",
            "2221012222222101222",
            "1111012112112101111",
            "2222022122212202222",
            "1111012111112101111",
            "2221012222222101222",
            "1111012111112101111",
            "1000000001000000001",
            "1011011101011101101",
            "1001000002000001001",
            "1101012111112101011",
            "1000010001000100001",
            "1011111101011111101",
            "1111111111111111111"
        ];

        var map = [];
        for (var r = 0; r < mapLayout.length; r++) {
            map[r] = [];
            for (var c = 0; c < mapLayout[r].length; c++) {
                map[r][c] = parseInt(mapLayout[r].charAt(c));
            }
        }

        var pacman = {
            x: 9 * tileSize,
            y: 15 * tileSize,
            radius: 8,
            speed: 2,
            dirX: 0,
            dirY: 0,
            nextDirX: 0,
            nextDirY: 0,
            angle: 0.2
        };

        var ghosts = [
            { x: 9 * tileSize, y: 7 * tileSize, radius: 8, speed: 2, dirX: 1, dirY: 0, color: "#ff0000" },
            { x: 8 * tileSize, y: 7 * tileSize, radius: 8, speed: 2, dirX: -1, dirY: 0, color: "#ffb8ff" }
        ];

        window.addEventListener("keydown", function(e) {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key) > -1) {
                e.preventDefault(); 
            }
            switch(e.key) {
                case "ArrowUp":    pacman.nextDirX = 0;  pacman.nextDirY = -1; break;
                case "ArrowDown":  pacman.nextDirX = 0;  pacman.nextDirY = 1;  break;
                case "ArrowLeft":  pacman.nextDirX = -1; pacman.nextDirY = 0;  break;
                case "ArrowRight": pacman.nextDirX = 1;  pacman.nextDirY = 0;  break;
            }
        });

        function isWallAt(tileX, tileY) {
            if (tileX < 0 || tileX >= mapLayout[0].length) return false;
            if (tileY < 0 || tileY >= map.length) return true;
            return map[tileY][tileX] === 1;
        }

        function updatePacman() {
            if (pacman.x % tileSize === 0 && pacman.y % tileSize === 0) {
                var currentTileX = Math.floor(pacman.x / tileSize);
                var currentTileY = Math.floor(pacman.y / tileSize);

                if (map[currentTileY] && map[currentTileY][currentTileX] === 0) {
                    map[currentTileY][currentTileX] = 2; 
                    score += 10;
                    scoreElement.innerText = score;
                    checkWinCondition();
                }

                if (!isWallAt(currentTileX + pacman.nextDirX, currentTileY + pacman.nextDirY)) {
                    pacman.dirX = pacman.nextDirX;
                    pacman.dirY = pacman.nextDirY;
                }

                if (isWallAt(currentTileX + pacman.dirX, currentTileY + pacman.dirY)) {
                    pacman.dirX = 0;
                    pacman.dirY = 0;
                }
            }

            pacman.x += pacman.dirX * pacman.speed;
            pacman.y += pacman.dirY * pacman.speed;

            if (pacman.x < 0) pacman.x = canvas.width - tileSize;
            if (pacman.x >= canvas.width) pacman.x = 0;
        }

        function updateGhosts() {
            for (var g = 0; g < ghosts.length; g++) {
                var ghost = ghosts[g];
                if (ghost.x % tileSize === 0 && ghost.y % tileSize === 0) {
                    var currentTileX = Math.floor(ghost.x / tileSize);
                    var currentTileY = Math.floor(ghost.y / tileSize);

                    var directions = [
                        {x: 1, y: 0}, {x: -1, y: 0},
                        {x: 0, y: 1}, {x: 0, y: -1}
                    ];
                    
                    var validDirs = [];
                    for (var i = 0; i < directions.length; i++) {
                        var d = directions[i];
                        if (d.x === -ghost.dirX && d.y === -ghost.dirY) continue;
                        if (!isWallAt(currentTileX + d.x, currentTileY + d.y)) {
                            validDirs.push(d);
                        }
                    }

                    if (validDirs.length === 0) {
                        if (!isWallAt(currentTileX - ghost.dirX, currentTileY - ghost.dirY)) {
                            ghost.dirX = -ghost.dirX;
                            ghost.dirY = -ghost.dirY;
                        }
                    } else {
                        var chosen = validDirs[Math.floor(Math.random() * validDirs.length)];
                        ghost.dirX = chosen.x;
                        ghost.dirY = chosen.y;
                    }
                }

                ghost.x += ghost.dirX * ghost.speed;
                ghost.y += ghost.dirY * ghost.speed;

                if (ghost.x < 0) ghost.x = canvas.width - tileSize;
                if (ghost.x >= canvas.width) ghost.x = 0;
            }
        }

        function checkCollisions() {
            for (var g = 0; g < ghosts.length; g++) {
                var ghost = ghosts[g];
                var dist = Math.hypot((pacman.x + tileSize/2) - (ghost.x + tileSize/2), (pacman.y + tileSize/2) - (ghost.y + tileSize/2));
                if (dist < pacman.radius + ghost.radius) {
                    gameOver = true;
                }
            }
        }

        function checkWinCondition() {
            for (var row = 0; row < map.length; row++) {
                if (map[row].indexOf(0) > -1) return;
            }
            gameWon = true;
        }

        function drawMap() {
            for (var r = 0; r < map.length; r++) {
                for (var c = 0; c < map[r].length; c++) {
                    if (map[r][c] === 1) {
                        ctx.fillStyle = "#1919b3";
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                    } else if (map[r][c] === 0) {
                        ctx.fillStyle = "#ffb8ae";
                        ctx.beginPath();
                        ctx.arc(c * tileSize + tileSize/2, r * tileSize + tileSize/2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function drawPacman() {
            ctx.fillStyle = "#ffff00";
            ctx.beginPath();
            
            var rotation = 0;
            if (pacman.dirX === 1) rotation = 0;
            else if (pacman.dirX === -1) rotation = Math.PI;
            else if (pacman.dirY === 1) rotation = Math.PI * 0.5;
            else if (pacman.dirY === -1) rotation = Math.PI * 1.5;

            if (pacman.dirX !== 0 || pacman.dirY !== 0) {
                pacman.angle = (pacman.angle === 0.2) ? 0.05 : 0.2; 
            }

            ctx.arc(
                pacman.x + tileSize/2, pacman.y + tileSize/2, pacman.radius, 
                rotation + pacman.angle, 
                rotation + Math.PI * 2 - pacman.angle
            );
            ctx.lineTo(pacman.x + tileSize/2, pacman.y + tileSize/2);
            ctx.fill();
        }

        function drawGhosts() {
            for (var g = 0; g < ghosts.length; g++) {
                var ghost = ghosts[g];
                ctx.fillStyle = ghost.color; 
                ctx.beginPath();
                ctx.arc(ghost.x + tileSize/2, ghost.y + tileSize/2, ghost.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawMap();
            
            if (!gameOver && !gameWon) {
                updatePacman();
                updateGhosts();
                checkCollisions();
            }

            drawPacman();
            drawGhosts();

            if (gameOver) {
                ctx.fillStyle = "red";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER", canvas.width / 4, canvas.height / 2);
                return;
            }

            if (gameWon) {
                ctx.fillStyle = "green";
                ctx.font = "30px Arial";
                ctx.fillText("YOU WIN!", canvas.width / 3, canvas.height / 2);
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
